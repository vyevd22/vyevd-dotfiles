# Lain Lock Screen
# Colors:
#   Base: #000000
#   Pink: #D27389
#   Magenta: #BB607B
#   Text: #cdd3e0
#   Steel gray: #6a7a8a

$font = Mx437 IBM VGA 8x16
$pink = rgb(210, 115, 137)
$magenta = rgb(187, 96, 123)
$black = rgb(0, 0, 0)
$text = rgb(205, 211, 224)

general {
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
    fractional_scaling = 0
    text_trim = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 5, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

# Background: blurred screenshot of current desktop
background {
    monitor =
    path = screenshot
    color = rgb(0, 0, 0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.05
    reload_time = -1
}

# Clock — large pink, top-right (with CRT phosphor glow behind it)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(210, 115, 137, 0.15)
    font_size = 94
    font_family = $font
    position = -38, -2
    halign = right
    valign = top
    zindex = 0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $pink
    font_size = 90
    font_family = $font
    position = -40, 0
    halign = right
    valign = top
    zindex = 1
}

# Date — smaller text, below clock
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $text
    font_size = 20
    font_family = $font
    position = -40, -150
    halign = right
    valign = top
    zindex = 0
}

# Password input — centered, terminal feel
input-field {
    monitor =
    size = 340, 60
    outline_thickness = 3
    rounding = 6
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(106, 122, 138, 0.6)
    inner_color = rgba(0, 0, 0, 0.8)
    font_color = $text
    font_family = $font
    numlock_color = -1
    capslock_color = -1
    check_color = rgb(210, 115, 137)
    fail_color = rgb(187, 96, 123)
    fail_text = <i>failed login ($ATTEMPTS)</i>
    placeholder_text = password:
    fade_on_empty = true
    fade_timeout = 1000
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
    zindex = 0
}

# User label above input — terminal login banner
label {
    monitor =
    text = <span foreground="##6a7a8a">arch login: </span><span foreground="##D27389"><b>$USER</b></span>
    font_size = 16
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
    zindex = 0
}

# System info — bottom-left, like a terminal login banner
label {
    monitor =
    text = cmd[update:86400] uname -rs
    color = rgba(106, 122, 138, 0.5)
    font_size = 12
    font_family = $font
    position = 20, 20
    halign = left
    valign = bottom
    zindex = 0
}

# Uptime — below system info
label {
    monitor =
    text = cmd[update:60] uptime -p | sed 's/up //'
    color = rgba(106, 122, 138, 0.4)
    font_size = 12
    font_family = $font
    position = 20, 44
    halign = left
    valign = bottom
    zindex = 0
}
