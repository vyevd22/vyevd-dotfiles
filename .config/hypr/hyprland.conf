################
### MONITORS ###
################

# Left: Philips 273B9 (DP) — 75Hz
monitor = DP-3, 1920x1080@75, 0x0, 1.0
# Right: ASUS VA27EHF (HDMI) — 100Hz
monitor = HDMI-A-1, 1920x1080@100, 1920x0, 1.0


####################
###   PROGRAMS   ###
####################

$terminal = kitty
$fileManager = kitty -e yazi
$menu = rofi -show drun


#################
### AUTOSTART ###
#################

exec-once = waybar & waybar -c ~/.config/waybar/config-dp3.jsonc & awww-daemon & /usr/lib/polkit-kde-authentication-agent-1
exec-once = sleep 1 && awww img ~/Pictures/Wallpapers/Lets_All_Love_Lain.jpeg
exec-once = wl-paste --type text --watch cliphist store & wl-paste --type image --watch cliphist store
exec-once = /usr/bin/pypr
exec-once = pkill -f "dunst|mako" 2>/dev/null; swaync
exec-once = sleep 1 && swaync-client -d


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_STYLE_OVERRIDE,kvantum


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(210,115,137,1.0) rgba(187,96,123,1.0) 35deg
    col.inactive_border = rgba(26,26,26,0.4)
    col.nogroup_border = rgba(26,26,26,0.4)
    col.nogroup_border_active = rgba(210,115,137,1.0) rgba(187,96,123,1.0) 35deg
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 0.9

    blur {
        enabled = true
        size = 6
        passes = 3
        contrast = 0.9
        brightness = 1.1
        noise = 0.01
    }
}

animations {
    enabled = yes, obviously

    bezier = easeOutExpo,    0.19, 1,    0.22, 1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     2,     easeOutExpo
    animation = windows,       1,     2.5,   easeOutExpo
    animation = windowsIn,     1,     2,     easeOutExpo,   popin 87%
    animation = windowsOut,    1,     1,     linear,        popin 87%
    animation = fadeIn,        1,     0.8,   almostLinear
    animation = fadeOut,       1,     0.7,   almostLinear
    animation = fade,          1,     1.5,   quick
    animation = layers,        1,     1.8,   easeOutExpo
    animation = layersIn,      1,     2,     easeOutExpo,   fade
    animation = layersOut,     1,     0.8,   linear,        fade
    animation = fadeLayersIn,  1,     0.9,   almostLinear
    animation = fadeLayersOut, 1,     0.7,   almostLinear
    animation = workspaces,    1,     2.5,   easeOutExpo,   slide
    animation = workspacesIn,  1,     2.5,   easeOutExpo,   slide
    animation = workspacesOut, 1,     2.5,   easeOutExpo,   slide
    animation = zoomFactor,    1,     3.5,   quick
}

dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1 # disable anime mascot wallpaper
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    middle_click_paste = false
    disable_splash_rendering = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us,gr,de          # english, greek, german
    kb_options = grp:alt_shift_toggle
    kb_variant =
    kb_model =
    kb_rules =
    follow_mouse = 1
    sensitivity = -0.1
    force_no_accel = true
    accel_profile = flat
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod SHIFT, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, hyprctl dispatch exit
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = ALT, grave, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod SHIFT, S, exec, bash -c 'grimblast --freeze save area - | wl-copy'
bind = $mainMod SHIFT, L, exec, bash -c 'grimblast --freeze save area ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S%N).png'
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "❯ " | cliphist decode | wl-copy
bind = $mainMod, F11, fullscreen, 0
bind = $mainMod, period, exec, rofi -modi emoji -show emoji   # muscle memory from windows
bind = , F8, exec, pkill -SIGUSR1 -f "gpu-screen-recorder"  # medal clipping alternative, auto-compresses via ffmpeg

# focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# pyprland scratchpads
bind = $mainMod, A, exec, pypr-client toggle term
bind = $mainMod, O, exec, pypr-client toggle calc
bind = $mainMod SHIFT, X, exec, kitty -e ~/.local/bin/tyler
bind = $mainMod, P, exec, pypr-client toggle cava
bind = $mainMod, B, exec, pypr-client expose

# swaync notification center
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, D, exec, swaync-client -d

# wlogout powermenu
bind = $mainMod, Escape, exec, wlogout -C ~/.config/wlogout/style.css -b 6 -c 8 -T 520 -B 520 -L 200 -R 200

# hyprlock
bind = $mainMod, Backspace, exec, hyprlock

# WiFi menu (network module removed from waybar, use rofi still)
bind = $mainMod, W, exec, ~/.local/bin/rofi-wifi-menu.sh

# pyprland zoom
bind = $mainMod, Z, exec, pypr-client zoom ++0.5
bind = $mainMod SHIFT, Z, exec, pypr-client zoom

# screensavers
bind = $mainMod, grave, exec, kitty --class screensaver -e cmatrix -C magenta -b
bind = $mainMod SHIFT, grave, exec, bash -c 'hyprctl clients -j | jq -r ".[] | select(.class == \"screensaver\") | .address" | xargs -I{} hyprctl dispatch closewindow address:{}'

# scroll workspaces
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from all apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Terminal transparency handled by kitty's background_opacity in kitty.conf
# Cava visualizer — full opacity for the bars
windowrule {
    name = cava-opacity

    match:class = ^scratch-cava$

    opacity = 1.0 1.0
}

# Screensaver — fullscreen terminal eye candy
windowrule {
    name = screensaver-fullscreen

    match:class = ^screensaver$

    fullscreen = 1
    no_anim = true
    opacity = 1.0 1.0
}




