format = """
[╭─](bold #D27389) $username$hostname $directory [$git_branch]($style)$git_status
[╰─](bold #E6D47B) $character"""

add_newline = true

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold #8A3F52"
style_root = "bold #BB607B"

[hostname]
ssh_only = false
format = "[@$hostname]($style)"
style = "#E6D47B"

[directory]
format = "[$path]($style)"
style = "#6a7a8a"
truncation_length = 3
truncation_symbol = "…"
truncate_to_repo = true

[git_branch]
format = "[$branch]($style)"
symbol = ""
style = "#6a7a8a"

[git_status]
format = " [$modified]($style)"
style = "#6a7a8a"
modified = "●"
conflicted = "!"
ahead = ">>"
behind = "<<"
diverged = ">/>"
untracked = "..."
stashed = "=$"
staged = ""
renamed = ""
deleted = ""

[character]
success_symbol = "[❯](bold #E6D47B)"
error_symbol = "[❯](bold #BB607B)"
