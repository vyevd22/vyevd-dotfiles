# Lain/Kikuri Kitty colorscheme
# Pale pink #D27389, Kikuri magenta #BB607B, steel gray #6a7a8a

# Font
font_family      Mx437 IBM VGA 8x16
font_size        16.0
font_antialiasing grayscale

# Nerd Font fallback for icons
symbol_map U+E000-U+FFFF JetBrainsMono Nerd Font Mono

# 16-color palette — monochrome + pink accent
# Pink only on red (color1/9) and magenta (color5/13) slots
color0  #000000
color8  #1a1a1a
color1  #BB607B
color9  #a06a8a
color2  #2a2a2a
color10 #3a3a3a
color3  #3a3a3a
color11 #4a4a4a
color4  #5a6a7a
color12 #6a7a8a
color5  #7a5a6a
color13 #a06a8a
color6  #3a4a5a
color14 #5a6a7a
color7  #cdd3e0
color15 #dde3f0

# Cursor
cursor_shape        block
cursor_trail        0
cursor_beam_thickness 1.0

# Scrollback
scrollback_lines    10000
scrollback_pager    less --chop-long-lines --clear-screen
scrollback_indicator_opacity 0.5

# Mouse
mouse_hide_wait     2.0
url_color           #D27389
url_style           curly

# Performance
repaint_defer       false
sync_to_monitor     false
